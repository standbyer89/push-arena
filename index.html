<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>밀치기 대결</title>
<meta name="description" content="캐릭터 6종의 기술과 궁극기를 맞혀 상대를 화면 밖으로 날려버리는 대결 게임. 컴퓨터와 하거나 친구와 온라인으로 즐겨요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%8A%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#0f1230; --card:#ffffff12; --line:#ffffff26; --text:#eef0ff; --muted:#a9b0d9; --accent:#ffd479; --p0:#5ec2ff; --p1:#ff6b81; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; user-select:none; touch-action:none; overscroll-behavior:none; }
  button { font:inherit; color:inherit; }
  :root { --cw:max(280px, min(calc(100vw - 16px), calc(100dvh - 180px))); } /* 게임 화면 한 변 길이: 남는 공간을 최대한 사용 (HUD+버튼줄+여백 ≈ 175px) */
  #app { height:100%; margin:0 auto; display:flex; flex-direction:column; align-items:center; padding:8px; gap:6px; position:relative; overflow:hidden; }
  .hud { width:var(--cw); display:flex; gap:8px; visibility:hidden; }
  .ingame .hud { visibility:visible; }
  .pl { flex:1; min-width:0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px 10px; font-size:13px; }
  .pl.p0 { border-color:var(--p0); } .pl.p1 { border-color:var(--p1); text-align:right; }
  .pl .top { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .pl .nm { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:420px) { .pl .cn { display:none; } }
  .pl .hp { flex:none; white-space:nowrap; font-size:12px; letter-spacing:-1px; }
  .pl.p1 .top, .pl.p1 .lab { flex-direction:row-reverse; }
  .pl .pct { font-size:24px; font-weight:800; line-height:1; transition:color .2s; }
  .bar { height:7px; border-radius:4px; background:#ffffff1f; margin-top:3px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); }
  .bar.cd i { background:#9fb0ff; }
  .bar.ult.full i { background:#ff9f43; animation:glow .6s infinite alternate; }
  @keyframes glow { to { filter:brightness(1.6); } }
  .pl.p1 .bar i { margin-left:auto; }
  .lab { font-size:11px; color:var(--muted); margin-top:3px; display:flex; justify-content:space-between; }
  .lab .rdy { color:#ff9f43; font-weight:700; }
  canvas { width:var(--cw); aspect-ratio:1; border-radius:16px; background:#0b0e24; touch-action:none; }
  #foot { width:var(--cw); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #hint { font-size:12px; color:var(--muted); flex:1; }
  .ib { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--card); cursor:pointer; font-size:16px; }
  #touch { display:none; width:var(--cw); justify-content:space-between; align-items:center; }
  @media (pointer:coarse) { :root { --cw:max(280px, min(calc(100vw - 16px), calc(100dvh - 350px))); } #touch { display:flex; } #hint { display:none; } }
  #stick { width:120px; height:120px; border-radius:50%; background:#ffffff14; border:2px solid var(--line); position:relative; touch-action:none; }
  #knob { width:50px; height:50px; border-radius:50%; background:#ffffff55; position:absolute; left:35px; top:35px; }
  .tb { width:76px; height:76px; border-radius:50%; border:2px solid var(--line); background:#ffffff1a; font-weight:700; margin-left:10px; touch-action:none; }
  #bUlt { border-color:var(--accent); color:var(--accent); }

  #menu { position:absolute; inset:0; background:#0f1230; display:flex; flex-direction:column; align-items:center; padding:14px 12px 24px; overflow-y:auto; touch-action:pan-y; z-index:5; }
  #menu.hide { display:none; }
  #menu.pause { background:#0f1230aa; }
  .in { width:100%; max-width:580px; display:flex; flex-direction:column; align-items:center; gap:10px; margin:auto; }
  h1 { margin:4px 0 0; font-size:26px; text-align:center; }
  h2 { margin:0; font-size:15px; color:var(--accent); font-weight:600; text-align:center; }
  .sub, .note { font-size:13px; color:var(--muted); text-align:center; }
  .note { font-size:12px; }
  .err { color:#ff8a80; font-size:13px; text-align:center; }
  .col { width:100%; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .btn { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 14px; cursor:pointer; }
  .btn:hover { border-color:var(--accent); }
  .btn.main, .seg button.on { background:var(--accent); color:#222; border-color:var(--accent); font-weight:700; }
  .btn.big { padding:14px; font-size:17px; width:100%; }
  .seg { display:flex; gap:4px; flex-wrap:wrap; }
  .seg button { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px; }
  .set { width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px 10px; display:flex; flex-direction:column; gap:6px; }
  .set .r { display:flex; gap:8px; align-items:center; }
  .set .k { width:44px; font-size:12px; color:var(--muted); flex:none; }
  .mapinfo { font-size:12px; color:var(--muted); padding-left:52px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; width:100%; }
  @media (min-width:600px) { .grid { grid-template-columns:repeat(3,1fr); } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; text-align:left; cursor:pointer; }
  .card:hover, .card.sel { border-color:var(--accent); }
  .card.sel { background:#ffd47922; }
  .card .em { font-size:38px; line-height:1; } .card .nm { font-weight:700; margin-top:2px; }
  .card .ds { font-size:11px; color:var(--muted); margin:2px 0 4px; }
  .card .pips { font-size:10px; color:var(--muted); letter-spacing:1px; margin-bottom:4px; line-height:1.4; } .card .pips b { color:var(--accent); font-weight:400; }
  .card .sk { font-size:11px; line-height:1.45; } .card .sk b { color:var(--accent); font-weight:600; }
  .card .ko { color:#ff8a80; }
  .kos { color:var(--muted); } .kos.on { color:#ff8a80; font-weight:700; animation:glow .5s infinite alternate; }
  .code { font-size:48px; font-weight:800; letter-spacing:.25em; color:var(--accent); padding-left:.25em; }
  input.code-in { width:130px; font:inherit; font-size:22px; letter-spacing:.2em; text-align:center; text-transform:uppercase; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:8px; user-select:text; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  td, th { padding:6px 8px; border-bottom:1px solid var(--line); text-align:center; }
  th { color:var(--muted); font-weight:500; }
  .help { width:100%; font-size:13px; line-height:1.6; text-align:left; display:flex; flex-direction:column; gap:8px; }
  .help section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .help h3 { margin:0 0 4px; font-size:14px; color:var(--accent); }
  .help kbd { background:#ffffff22; border-radius:5px; padding:0 5px; font-size:12px; }
  .spin { width:34px; height:34px; border:4px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <div class="hud"><div class="pl p0" id="h0"></div><div class="pl p1" id="h1"></div></div>
  <canvas id="c" width="800" height="800"></canvas>
  <div id="foot">
    <div id="hint"></div>
    <div class="row"><button class="ib" id="btnSnd" title="효과음">🔊</button><button class="ib" id="btnPause" title="일시정지">⏸</button></div>
  </div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div><button class="tb" id="bSkill">스킬</button><button class="tb" id="bUlt">궁극기</button></div>
  </div>
  <div id="menu"></div>
</div>
<script>
// ======================================================================
//  데이터
// ======================================================================
const W = 800, C = { x:400, y:400 }, ZOOM = 1.12, KB = .5;
const CH = [
  { emoji:"🐱", name:"냥이", color:"#ffb74d", r:28, mass:1.15, speed:320, desc:"균형형 · 돌진과 광역 펀치", stat:[3, 3, 3],
    skill:{ name:"박치기 돌진", info:"앞으로 돌진해 부딪힌 상대를 날림", type:"dash", cd:1.8, speed:850, time:.25, power:850, dmg:9, range:260, launch:45 },
    ult:{ name:"냥냥 펀치 폭풍", info:"주변 전체를 한 방에 날려버림", type:"blast", radius:230, power:1600, dmg:18, stun:.4, range:230, cast:.6, launch:0 } },
  { emoji:"🐻", name:"곰돌", color:"#a1887f", r:36, mass:1.5, speed:250, desc:"탱커 · 무겁고 힘이 셈", stat:[2, 5, 5],
    skill:{ name:"앞발 후려치기", info:"넓은 부채꼴 근접 강타", type:"arc", cd:2.5, range:125, arc:2.2, power:1100, dmg:12, launch:40 },
    ult:{ name:"대지 강타", info:"느리지만 넓은 충격파로 날려버림", type:"blast", radius:260, power:1600, dmg:22, stun:.9, range:260, cast:.7, launch:0 } },
  { emoji:"🐰", name:"토순", color:"#f8bbd0", r:24, mass:.8, speed:330, desc:"스피드 · 가볍고 빠름", stat:[5, 1, 2],
    skill:{ name:"점프 내려찍기", info:"뛰어올라(무적) 착지 충격파", type:"dash", cd:2.2, speed:560, time:.45, air:true, land:{ radius:125, power:600, dmg:9, launch:25 }, range:260, launch:25 },
    ult:{ name:"3연속 돌진", info:"상대를 쫓아 박치기! 맞으면 날려버림", type:"dash", speed:900, time:.22, power:500, dmg:6, chain:2, range:320, cast:.3, launch:0 } },
  { emoji:"🐙", name:"문어", color:"#ce93d8", r:28, mass:.95, speed:290, desc:"원거리 · 먹물로 견제", stat:[3, 3, 3],
    skill:{ name:"먹물 발사", info:"빠른 먹물 탄환으로 밀어냄", type:"proj", cd:2.3, speed:850, pr:16, life:1, power:700, dmg:8, range:420, launch:55 },
    ult:{ name:"먹물 폭풍", info:"사방으로 먹물 16발, 맞으면 날려버림", type:"proj", n:16, speed:620, pr:14, life:1, power:950, dmg:10, range:300, cast:.5, launch:0 } },
  { emoji:"🦔", name:"고슴이", color:"#bcaaa4", r:26, mass:1.2, speed:280, desc:"반격형 · 닿으면 튕겨냄", stat:[3, 4, 4],
    skill:{ name:"가시 웅크리기", info:"1.3초간 닿는 상대를 튕겨냄", type:"shield", cd:5.5, time:1.3, power:1100, dmg:10, range:110, launch:50 },
    ult:{ name:"가시 구르기", info:"2.5초간 굴러 닿으면 날려버림", type:"shield", time:2.2, speedMul:1.8, power:1100, dmg:13, range:260, cast:.3, launch:0 } },
  { emoji:"🐧", name:"펭귄", color:"#81d4fa", r:28, mass:1.3, speed:330, desc:"컨트롤형 · 미끄럼과 얼음", stat:[3, 3, 3],
    skill:{ name:"배 미끄럼", info:"길게 미끄러지며 상대를 밀침", type:"dash", cd:2.1, speed:750, time:.55, power:1250, dmg:10, range:300, launch:45 },
    ult:{ name:"빙하 충격", info:"주변을 1.4초간 얼림 (얼린 상대는 뭐든 맞으면 산산조각)", ko:"얼린 상대를 맞히면 산산조각 KO", type:"blast", radius:300, power:1000, dmg:14, stun:1.4, ice:true, range:300, cast:.55 } },
];
const KEYMAP = [
  { up:["KeyW"], down:["KeyS"], left:["KeyA"], right:["KeyD"], skill:["KeyJ","KeyF"], ult:["KeyK","KeyG"] },
  { up:["ArrowUp"], down:["ArrowDown"], left:["ArrowLeft"], right:["ArrowRight"], skill:["Period"], ult:["Slash"] },
];
const SOLO_EXTRA = { up:["ArrowUp"], down:["ArrowDown"], left:["ArrowLeft"], right:["ArrowRight"], skill:["Space"], ult:["ShiftLeft","ShiftRight"] };
const DIFFS = [
  { name:"연습", dummy:true },
  { name:"쉬움", react:[.35, .7], skillP:.35, ultP:.5, spd:.85, edge:55 },
  { name:"보통", react:[.15, .45], skillP:.8, ultP:1, spd:1, edge:70 },
  { name:"어려움", react:[.05, .2], skillP:1, ultP:1, spd:1.1, edge:90 },
];
// 지형: 좌표는 판 중앙 기준(아래에서 캔버스 좌표로 변환). shapes의 합집합이 땅, holes는 구멍.
const MAPS = [
  { name:"둥근 광장", icon:"🟣", info:"주황색 범퍼에 닿으면 튕겨 나가요", shrink:true, c:["#6573c4", "#3a4488", "#9fb0ff"],
    shapes:[{ t:"c", r:300 }],
    bumpers:[[150, 150], [-150, 150], [150, -150], [-150, -150]].map(([x, y]) => ({ x, y, r:22 })),
    spawn:[[-110, 0], [110, 0]], anchors:[[0, 0]] },
  { name:"얼음 광장", icon:"🧊", info:"바닥이 미끄러워요! 멈추기 어려워요", shrink:true, ice:true, c:["#a8d8f0", "#6fa8d6", "#e8f7ff"],
    shapes:[{ t:"r", hw:270, hh:270 }], bumpers:[{ x:0, y:0, r:32 }],
    spawn:[[-130, 0], [130, 0]], anchors:[[0, 0]] },
  { name:"십자 다리", icon:"➕", info:"길이 좁아요! 가운데 범퍼를 조심하세요", shrink:true, c:["#8a6fc4", "#5a3f94", "#d6c2ff"],
    shapes:[{ t:"r", hw:300, hh:80 }, { t:"r", hw:80, hh:300 }], bumpers:[{ x:0, y:0, r:24 }],
    spawn:[[-190, 0], [190, 0]], anchors:[[0, 0]] },
  { name:"회전 컨베이어", icon:"🌀", info:"바닥이 빙글빙글 돌아요. 가운데 기둥에 부딪히면 튕겨요", shrink:true, spin:300, c:["#5fa890", "#2f6b5a", "#a8f0d4"],
    shapes:[{ t:"c", r:300 }], holes:[{ x:0, y:0, r:80 }],
    spawn:[[-200, 0], [200, 0]], anchors:[[200, 0], [0, 200], [-200, 0], [0, -200]] },
  { name:"두 섬과 다리", icon:"🏝", info:"진흙은 느려지고, 노란 발판은 상대 쪽으로 쏴 줘요", c:["#c49a5f", "#7d5a2f", "#ffd9a0"],
    shapes:[{ t:"c", x:-170, r:130, fixed:true }, { t:"c", x:170, r:130, fixed:true }, { t:"r", hw:180, hh:45, fixed:true }],
    zones:[{ t:"mud", x:-170, y:75, r:45 }, { t:"mud", x:170, y:-75, r:45 }],
    pads:[{ x:-95, y:0, r:26, a:0 }, { x:95, y:0, r:26, a:Math.PI }],
    spawn:[[-200, 0], [200, 0]], anchors:[[-170, 0], [170, 0]] },
];
MAPS.forEach(m => {
  const A = o => { o.x = (o.x || 0) + C.x; o.y = (o.y || 0) + C.y; };
  [m.shapes, m.holes, m.bumpers, m.zones, m.pads].forEach(l => (l || []).forEach(A));
  m.spawn = m.spawn.map(([x, y]) => [C.x + x, C.y + y]); m.anchors = m.anchors.map(([x, y]) => [C.x + x, C.y + y]);
});
// 부호 있는 거리: 양수면 땅 위, 음수면 벽 바깥(가장자리·기둥)
function sd(x, y) {
  const m = G.map; let v = -1e9;
  for (const s of m.shapes) { const k = s.fixed ? 1 : G.sz, dx = x - s.x, dy = y - s.y;
    v = Math.max(v, s.t === "c" ? s.r * k - Math.hypot(dx, dy) : Math.min(s.hw * k - Math.abs(dx), s.hh * k - Math.abs(dy))); }
  for (const h of m.holes || []) v = Math.min(v, Math.hypot(x - h.x, y - h.y) - h.r);
  return v;
}

// ======================================================================
//  유틸 · 저장
// ======================================================================
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = ([a, b]) => a + Math.random() * (b - a);
const angDiff = (a, b) => Math.abs(((a - b + 3 * Math.PI) % (2 * Math.PI)) - Math.PI);
const COARSE = matchMedia("(pointer:coarse)").matches;
const REDUCED = matchMedia("(prefers-reduced-motion:reduce)").matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem("pa-" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pa-" + k, JSON.stringify(v)); } catch {} },
};
const setup = Object.assign({ mode:1, p0:0, p1:1, stocks:3, map:-1, diff:2, sound:true }, store.get("cfg", {}));
const rec = Object.assign({ w:0, l:0, streak:0, best:0, fast:0 }, store.get("rec", {}));
const saveCfg = () => store.set("cfg", { p0:setup.p0, p1:setup.p1, stocks:setup.stocks, map:setup.map, diff:setup.diff, sound:setup.sound });
if (!(setup.p0 in CH)) setup.p0 = 0;
if (!(setup.p1 in CH)) setup.p1 = 1;
if (!(setup.diff in DIFFS)) setup.diff = 2;
if (setup.map !== -1 && !(setup.map in MAPS)) setup.map = -1;

const cv = $("c"), ctx = cv.getContext("2d");
const menu = $("menu");
const keys = {}; let pressed = {}; const touch = { x:0, y:0, skill:false, ult:false };
let G = null, last = 0, lastMap = -1, menuState = null;
const STARS = Array.from({ length:70 }, () => ({ x:Math.random() * W, y:Math.random() * W, r:Math.random() * 1.4 + .4, s:Math.random() * 6 }));

// ======================================================================
//  효과음 (WebAudio 합성, 파일 없음)
// ======================================================================
const Sfx = (() => {
  let ac = null;
  const A = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } } if (ac.state === "suspended") ac.resume(); return ac; };
  function tone(f, d, o = {}) {
    const a = A(); if (!a || !setup.sound) return;
    const t = a.currentTime + (o.delay || 0), osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || "sine"; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    g.gain.setValueAtTime(o.vol ?? .15, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    osc.connect(g).connect(a.destination); osc.start(t); osc.stop(t + d + .02);
  }
  function noise(d, o = {}) {
    const a = A(); if (!a || !setup.sound) return;
    const n = Math.floor(a.sampleRate * d), b = a.createBuffer(1, n, a.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = b; f.type = o.type || "lowpass"; f.frequency.value = o.freq || 1200; g.gain.value = o.vol ?? .2;
    s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime + (o.delay || 0));
  }
  const S = {
    ui:() => tone(660, .07, { type:"triangle", vol:.1 }),
    hit:() => { noise(.12, { freq:1500, vol:.25 }); tone(140, .12, { to:60, type:"square", vol:.1 }); },

    const txt = dg ? String(dg) : "시작!"; ctx.strokeText(txt, C.x, 150); ctx.fillStyle = "#fff"; ctx.fillText(txt, C.x, 150); ctx.globalAlpha = 1;
    ctx.font = "bold 34px sans-serif"; ctx.lineWidth = 6; ctx.strokeStyle = "#000b"; ctx.strokeText(`${G.map.icon} ${G.map.name}`, C.x, 250); ctx.fillStyle = "#ffd479"; ctx.fillText(`${G.map.icon} ${G.map.name}`, C.x, 250);
    ctx.font = "22px sans-serif"; ctx.strokeText(G.map.info, C.x, 290); ctx.fillStyle = "#fff"; ctx.fillText(G.map.info, C.x, 290);
  }
  if (G.banner) { ctx.globalAlpha = Math.min(1, G.banner.t * 2); ctx.font = "bold 48px sans-serif"; ctx.lineWidth = 8; ctx.strokeStyle = "#000a"; ctx.strokeText(G.banner.text, C.x, 70); ctx.fillStyle = G.banner.color; ctx.fillText(G.banner.text, C.x, 70); ctx.globalAlpha = 1; }

}

function show(name, arg) {

  menu.className = name === "pause" ? "pause" : "";

  menu.scrollTop = top;
}
function toHome() {
  netClose(); if (G) G.running = false; G = null; $("app").classList.remove("ingame"); show("home");
}
function act(a, v) {
  const cur = menuState && menuState.name;
  switch (a) {
    case "mode": setup.mode = +v; show("select"); break;
    case "pick":
      if (cur === "select") { setup.p0 = +v; saveCfg(); show("opp"); }
      else if (cur === "opp") { setup.p1 = +v; saveCfg(); startGame(); }
      else if (cur === "onselect") { net.picks[mySlot()] = +v; netSend({ t:"pick", id:+v }); show("onselect"); tryHostStart(); }
      break;
    case "rand": setup.p1 = Math.floor(Math.random() * CH.length); saveCfg(); startGame(); break;
    case "back": show(cur === "opp" ? "select" : "home"); break;
    case "stocks": setup.stocks = +v; saveCfg(); show(cur); break;
    case "map": setup.map = +v; saveCfg(); show(cur); break;
    case "diff": setup.diff = +v; saveCfg(); show(cur); break;
    case "sound": setup.sound = !setup.sound; saveCfg(); syncSound(); show("home"); break;
    case "help": show("help"); break;
    case "records": show("records"); break;
    case "resetrec": if (confirm("기록을 모두 지울까요?")) { Object.assign(rec, { w:0, l:0, streak:0, best:0, fast:0 }); store.set("rec", rec); show("records"); } break;
    case "select": show("select"); break;
    case "menu": toHome(); break;
    case "resume": togglePause(); break;
    case "restart": startGame(); break;
    case "again": if (G && G.mode === 3) hostStart(); else if (G && G.mode !== 4) startGame(); break;
    case "online": show("online"); break;
    case "host": netHost(); break;
    case "join": netJoin($("code") ? $("code").value : ""); break;
    case "copy": try { navigator.clipboard.writeText(net.code); } catch {} break;
    case "copylink": try { navigator.clipboard.writeText(location.origin + location.pathname + "?room=" + net.code); } catch {} break;
    case "leave": toHome(); break;
    case "reselect": net.picks = [null, null]; netSend({ t:"reselect" }); G.running = false; show("onselect"); break;
  }
}

//  온라인 (PeerJS · 방장이 시뮬레이션, 참가자는 입력 전송 + 화면 수신)
// ======================================================================
const net = { peer:null, conn:null, host:false, code:"", picks:[null, null], remote:{ mx:0, my:0, skill:false, ult:false }, acc:0 };
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const genCode = () => Array.from({ length:4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
const loadPeer = () => new Promise((res, rej) => {
  if (window.Peer) return res();
  const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js";
  s.onload = res; s.onerror = () => rej(new Error("script")); document.head.appendChild(s);
});
function netSend(m) { try { if (net.conn && net.conn.open) net.conn.send(m); } catch {} }
function netClose() {
  const c = net.conn, p = net.peer; net.conn = null; net.peer = null; net.picks = [null, null];
  try { c && c.close(); } catch {} try { p && p.destroy(); } catch {}
}
function netLost(msg) {
  if (!net.conn) return;
  netClose(); if (G) G.running = false; show("lost", { msg });
}
async function netHost() {
  show("joining", { text:"방을 만드는 중…" });
  try { await loadPeer(); } catch { return show("online", { err:"인터넷에 연결할 수 없어요." }); }
  netClose(); net.host = true;
  const open = n => {
    const code = genCode(), peer = new Peer("pbtl-" + code);
    peer.on("open", () => { net.peer = peer; net.code = code; show("hostwait", { code }); });
    peer.on("connection", c => { if (net.conn) { c.close(); return; } net.conn = c; wireConn(c); });
    peer.on("error", e => {
      if (e.type === "unavailable-id" && n < 5) { peer.destroy(); open(n + 1); }
      else if (!net.conn) { netClose(); show("online", { err:"방을 만들지 못했어요 (" + e.type + ")" }); }
    });
  };
  open(0);
}
async function netJoin(code) {
  code = (code || "").toUpperCase().trim();
  if (code.length !== 4) return show("online", { err:"방 코드는 4글자예요." });
  show("joining", { text:`방 ${code}에 연결하는 중…` });
  try { await loadPeer(); } catch { return show("online", { err:"인터넷에 연결할 수 없어요." }); }
  netClose(); net.host = false;
  const peer = new Peer(); net.peer = peer;
  const fail = m => { clearTimeout(to); netClose(); show("online", { err:m }); };
  const to = setTimeout(() => fail("연결 시간이 초과됐어요. 코드와 인터넷을 확인해 주세요."), 12000);
  peer.on("open", () => {
    const c = peer.connect("pbtl-" + code, { reliable:true }); net.conn = c;
    c.on("open", () => { clearTimeout(to); wireConn(c); });
    c.on("error", () => fail("연결에 실패했어요."));
  });
  peer.on("error", e => { if (net.peer === peer) fail(e.type === "peer-unavailable" ? "그 코드의 방이 없어요." : "연결 오류 (" + e.type + ")"); });
}
function wireConn(c) {
  net.picks = [null, null];
  const ready = () => show("onselect");
  if (c.open) ready(); else c.on("open", ready);
  c.on("data", onNetMsg);
  c.on("close", () => { if (c === net.conn) netLost("상대와 연결이 끊겼어요."); });
}
function tryHostStart() { if (net.host && net.picks[0] != null && net.picks[1] != null && menuState && menuState.name === "onselect") hostStart(); }
function hostStart() {
  const map = pickMap(), p = [net.picks[0], net.picks[1]];
  netSend({ t:"start", p, map, stocks:setup.stocks });
  newGame({ mode:3, p, map, stocks:setup.stocks, local:0 });
}
function onNetMsg(m) {
  switch (m.t) {
    case "pick": net.picks[1 - mySlot()] = m.id; if (menuState && menuState.name === "onselect") { show("onselect"); tryHostStart(); } break;
    case "start": newGame({ mode:4, p:m.p, map:m.map, stocks:m.stocks, local:1 }); break;
    case "reselect": net.picks = [null, null]; if (G) G.running = false; show("onselect"); break;
    case "in": net.remote.mx = clamp(+m.mx || 0, -1, 1); net.remote.my = clamp(+m.my || 0, -1, 1); net.remote.skill = net.remote.skill || !!m.sk; net.remote.ult = net.remote.ult || !!m.ul; break;
    case "snap": applySnap(m); break;
  }
}
const r1 = x => Math.round(x * 10) / 10, r2 = x => Math.round(x * 100) / 100;
function hostBroadcast(raw) { // 초당 30번 상태 전송
  net.acc += raw; if (net.acc < 1 / 30) return; net.acc = 0;
  const m = { t:"snap", gt:r1(G.t), rd:r2(G.ready), sz:Math.round(G.sz * 1000) / 1000, sd:G.sudden ? 1 : 0, ov:G.over ? G.winner : -1,
    ps:G.ps.map(p => [r1(p.x), r1(p.y), r1(p.vx), r1(p.vy), r2(p.face), r1(p.dmg), p.stocks, r2(p.cd), Math.round(p.ult), p.shield > 0 ? 1 : 0, r2(p.stun), p.ice ? 1 : 0, r2(p.inv), p.fall > 0 ? Math.max(.01, r2(p.fall)) : 0, p.gone ? 1 : 0, r2(p.lift), r2(p.cast), p.launched ? 1 : 0]),
    pr:G.proj.map(q => [r1(q.x), r1(q.y), r1(q.vx), r1(q.vy), q.r, q.owner.slot]), ev:G.out };
  G.out = [];
  if (G.over) m.st = G.ps.map(p => p.st);
  netSend(m);
}
function handleEv(o) {
  switch (o.k) {
    case "snd": Sfx.play(o.n); break;
    case "shk": G.shake = Math.max(G.shake, REDUCED ? 0 : o.v); break;
    case "bn": G.banner = o.b; break;
    case "fl": G.flash = Math.max(G.flash, o.v); break;
    case "hit": G.ps[o.s].flash = .14; buzz(o.s, o.b); break;
    case "pls": { const l = G.map[o.l]; if (l && l[o.i]) l[o.i].pulse = o.v; break; }
    default: G.fx.push(o);
  }
}
function applySnap(m) {
  if (!G || G.mode !== 4) return;
  G.t = m.gt; G.ready = m.rd; G.sz = m.sz; G.sudden = !!m.sd;
  const now = performance.now();
  m.ps.forEach((a, i) => {
    const p = G.ps[i], first = p.tx === undefined;
    p.tx = a[0]; p.ty = a[1]; p.vx = a[2]; p.vy = a[3]; p.face = a[4]; p.dmg = a[5]; p.stocks = a[6]; p.cd = a[7]; p.ult = a[8];
    p.shield = a[9]; p.stun = a[10]; p.ice = !!a[11]; p.inv = a[12]; p.fall = a[13]; p.gone = !!a[14]; p.lift = a[15]; p.cast = a[16]; p.launched = !!a[17]; p.snapAt = now;
    if (first || p.fall > 0) { p.x = p.tx; p.y = p.ty; }
  });
  G.proj = m.pr.map(a => ({ x:a[0], y:a[1], vx:a[2], vy:a[3], r:a[4], owner:G.ps[a[5]] }));
  m.ev.forEach(handleEv);
  if (m.st) m.st.forEach((s, i) => { G.ps[i].st = s; });
  if (m.ov >= 0 && !G.over) { G.over = true; G.winner = m.ov; G.overReal = 0; }
}
function guestFrame(raw) {
  const inp = localInput(0, true);
  netSend({ t:"in", mx:r2(inp.mx), my:r2(inp.my), sk:inp.skill, ul:inp.ult });
  const now = performance.now();
  G.ps.forEach(p => {
    if (p.tx === undefined) return;
    if (p.fall > 0) { p.x += p.vx * raw; p.y += p.vy * raw; return; } // 날아가는 중엔 속도로 이어서 이동
    const age = Math.min(.12, (now - p.snapAt) / 1000), px = p.tx + p.vx * age, py = p.ty + p.vy * age;
    if (Math.hypot(px - p.x, py - p.y) > 160) { p.x = px; p.y = py; } else { const k = Math.min(1, raw * 18); p.x += (px - p.x) * k; p.y += (py - p.y) * k; }
  });
  G.proj.forEach(q => { q.x += q.vx * raw; q.y += q.vy * raw; });
  if (G.ready > 0) { G.ready -= raw; countdown(); }
  fxStep(raw); visualStep(raw);
  if (G.over) { G.overReal += raw; if (G.overReal > 2.4) { G.running = false; Sfx.play(G.winner === G.local ? "win" : "lose"); show("result"); } }
}

// ======================================================================
//  메인 루프 · 터치
// ======================================================================
function loop(ts) {
  const raw = Math.min(.033, (ts - last) / 1000); last = ts;
  if (G && (G.running || G.paused)) {
    if (G.running && !G.paused) { if (G.mode === 4) guestFrame(raw); else update(raw); }
    draw(); if (G.running) hud();
    if (G.running && G.mode === 3) hostBroadcast(raw);
  } else if (!G) { ctx.clearRect(0, 0, W, W); drawBg(); }
  pressed = {};
  requestAnimationFrame(loop);
}
(() => {
  const st = $("stick"), kn = $("knob"); let id = null;
  const move = e => { const r = st.getBoundingClientRect();
    let x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
    const l = Math.hypot(x, y), m = r.width / 2; if (l > m) { x = x / l * m; y = y / l * m; }
    kn.style.transform = `translate(${x}px,${y}px)`; touch.x = x / m; touch.y = y / m; };
  st.addEventListener("pointerdown", e => { id = e.pointerId; st.setPointerCapture(id); move(e); });
  st.addEventListener("pointermove", e => { if (e.pointerId === id) move(e); });
  const end = e => { if (e.pointerId === id) { id = null; touch.x = touch.y = 0; kn.style.transform = ""; } };
  st.addEventListener("pointerup", end); st.addEventListener("pointercancel", end);
  $("bSkill").addEventListener("pointerdown", () => touch.skill = true);
  $("bUlt").addEventListener("pointerdown", () => touch.ult = true);
})();
addEventListener("beforeunload", () => netClose());

syncSound();
const roomParam = new URLSearchParams(location.search).get("room");
if (roomParam) { show("online"); netJoin(roomParam); } else show("home");
requestAnimationFrame(loop);
</script>
