<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>게임 선택</title>
<meta name="description" content="밀치기 대결, 테트리스 — 혼자서도, 친구와 온라인으로도 즐기는 작은 게임 모음.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#0f1230; --card:#ffffff12; --line:#ffffff26; --text:#eef0ff; --muted:#a9b0d9; --accent:#ffd479; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  main { max-width:520px; margin:0 auto; padding:max(28px, env(safe-area-inset-top)) 16px 40px; display:flex; flex-direction:column; gap:14px; }
  h1 { margin:0; font-size:26px; text-align:center; } .sub { text-align:center; color:var(--muted); font-size:14px; margin-top:-6px; }
  a.game { display:flex; gap:14px; align-items:center; padding:16px; border-radius:18px; border:1px solid var(--line); background:var(--card); color:inherit; text-decoration:none; }
  a.game:hover, a.game:focus-visible { border-color:var(--accent); outline:none; }
  a.game:active { transform:scale(.99); }
  .em { font-size:48px; line-height:1; flex:none; width:60px; text-align:center; }
  .tx { min-width:0; flex:1; }
  .nm { font-size:19px; font-weight:700; } .ds { font-size:13px; color:var(--muted); margin:3px 0 7px; line-height:1.45; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; } .tags span { font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .rec { font-size:12px; color:var(--accent); margin-top:7px; min-height:1em; }
  .go { font-size:22px; color:var(--muted); flex:none; }
</style>
</head>
<body>
<main>
  <h1>🎮 게임 선택</h1>
  <div class="sub">하고 싶은 게임을 골라요</div>
  <a class="game" href="battle.html">
    <div class="em">🥊</div>
    <div class="tx"><div class="nm">밀치기 대결</div>
      <div class="ds">점프하고 피하고, 기술을 맞혀서 상대를 화면 밖으로 날려버리는 횡스크롤 대결. 캐릭터 6종, 무대 5종.</div>
      <div class="tags"><span>1~2명</span><span>컴퓨터 대결</span><span>온라인 친구 대결</span></div>
      <div class="rec" id="recBattle"></div></div>
    <div class="go">›</div>
  </a>
  <a class="game" href="tetris.html">
    <div class="em">🧱</div>
    <div class="tx"><div class="nm">테트리스</div>
      <div class="ds">혼자서 기록에 도전하거나, 최대 6명이 온라인으로 겨뤄요. 줄을 지우면 상대에게 쓰레기 줄을 보내고, 시간이 지날수록 빨라져요.</div>
      <div class="tags"><span>1~6명</span><span>기록 도전</span><span>온라인 대결</span></div>
      <div class="rec" id="recTetris"></div></div>
    <div class="go">›</div>
  </a>
</main>
<script>
// 예전 초대 링크(?room=코드)는 밀치기 대결로 보내 준다
const room = new URLSearchParams(location.search).get("room");
if (room) location.replace("battle.html?room=" + encodeURIComponent(room));
const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const rb = read("pa-rec"), rt = read("tetris-v1");
if (rb && rb.w + rb.l) document.getElementById("recBattle").textContent = `전적 ${rb.w}승 ${rb.l}패 · 최고 ${rb.best}연승`;
if (rt && rt.best) document.getElementById("recTetris").textContent = `최고 점수 ${rt.best.toLocaleString()} · 최다 ${rt.bestLines}줄`;
</script>
</body>
</html>
