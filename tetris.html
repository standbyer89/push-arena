<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>테트리스</title>
<meta name="description" content="혼자서 기록을 세우거나, 친구 최대 4명과 온라인으로 겨루는 테트리스. 콤보를 쌓으면 상대 모두에게 블록이 올라가요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B1%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#0f1230; --card:#ffffff12; --line:#ffffff26; --text:#eef0ff; --muted:#a9b0d9; --accent:#ffd479; --cw:360px; --mw:74px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; overscroll-behavior:none; }
  button, a { font:inherit; color:inherit; }
  #app { min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:6px 8px 8px; gap:6px; }
  #top { width:min(100%,640px); height:34px; display:flex; align-items:center; gap:8px; }
  #top b { font-size:15px; } #top .sp { flex:1; }
  .ib { width:34px; height:34px; padding:0; border-radius:10px; border:1px solid var(--line); background:var(--card); cursor:pointer; font-size:16px; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
  #stage { width:100%; display:flex; gap:12px; align-items:flex-start; justify-content:center; flex-direction:column; align-items:center; }
  .wide #stage { flex-direction:row; align-items:flex-start; }
  #opps { display:none; gap:8px; }
  .vs #opps { display:flex; justify-content:center; }
  .vs.wide #opps { display:grid; grid-template-columns:repeat(2,var(--mw)); align-content:start; gap:10px 8px; order:2; }
  .opp { width:var(--mw); min-width:0; }
  .opp .on { height:22px; font-size:11px; display:flex; align-items:center; gap:3px; white-space:nowrap; overflow:hidden; }
  .opp .on i { font-style:normal; color:#ff8a80; margin-left:auto; }
  .opp { cursor:pointer; } .opp.dead { opacity:.5; cursor:default; }
  .opp.tg canvas { outline:2px solid var(--accent); outline-offset:1px; } .opp.tg .on span:first-child::before { content:"🎯"; }
  /* 폰 세로 화면: 상대 판은 오른쪽 열 아래쪽에 작게 */
  .compact #opps { position:absolute; left:82.75%; width:14%; top:27.1%; flex-direction:column; justify-content:flex-start; gap:4px; z-index:2; }
  .compact .opp { width:100%; } .compact .opp .on { height:13px; font-size:9px; gap:1px; } .compact .opp .on span:nth-child(2) { display:none; }
  .compact canvas.mc { width:100%; border-radius:3px; }
  canvas { display:block; }
  canvas.mc { width:var(--mw); aspect-ratio:1/2; border-radius:6px; background:#0b0e24; }
  #wrap { position:relative; width:var(--cw); }
  #cv { width:100%; aspect-ratio:470/620; border-radius:14px; background:#0b0e24; }
  #ov { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:8px; z-index:5; }
  #ov.on { display:flex; }
  .panel { width:100%; max-height:100%; overflow:auto; touch-action:pan-y; background:#0c0f2a; border:1px solid var(--line); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:9px; text-align:center; }
  .panel h1 { margin:0; font-size:24px; } .panel h2 { margin:0; font-size:19px; }
  .sub { font-size:13px; color:var(--muted); } .note { font-size:12px; color:var(--muted); line-height:1.5; }
  .err { color:#ff8a80; font-size:13px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .btn { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 14px; cursor:pointer; text-decoration:none; text-align:center; display:inline-block; }
  .btn:hover { border-color:var(--accent); }
  .btn.main { background:var(--accent); color:#222; border-color:var(--accent); font-weight:700; }
  .btn.big { padding:13px; font-size:16px; width:100%; }
  .btn:disabled { opacity:.45; cursor:default; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 11px; font-size:12px; line-height:1.6; text-align:left; }
  .box b { color:var(--accent); }
  .code { font-size:44px; font-weight:800; letter-spacing:.25em; color:var(--accent); padding-left:.25em; }
  input.code-in { width:120px; font:inherit; font-size:20px; letter-spacing:.2em; text-align:center; text-transform:uppercase; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:8px; user-select:text; -webkit-user-select:text; }
  .slots { display:flex; flex-direction:column; gap:5px; }
  .slot { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-size:14px; }
  .slot.off { opacity:.4; border-style:dashed; } .slot small { margin-left:auto; color:var(--muted); }
  .rk { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-size:14px; }
  .rk.me { border-color:var(--accent); background:#ffd47922; } .rk small { margin-left:auto; color:var(--muted); font-size:11px; }
  #touch { display:none; width:min(100%,460px); gap:10px; }
  .touch #touch { display:flex; }
  #stick { flex:1.2; height:136px; border-radius:68px; border:1px solid var(--line); background:var(--card); position:relative; touch-action:none; overflow:hidden; }
  #stick .ar { position:absolute; color:#ffffff45; font-size:18px; pointer-events:none; }
  #stick .l { left:16px; top:50%; transform:translateY(-50%); } #stick .r { right:16px; top:50%; transform:translateY(-50%); } #stick .d { bottom:8px; left:50%; transform:translateX(-50%); }
  #knob { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:0; border-radius:50%; background:#ffd47944; border:2px solid var(--accent); transform:translate(-50%,-50%); pointer-events:none; }
  #btns { flex:1; display:flex; flex-direction:column; gap:6px; }
  .pair { flex:1; display:flex; gap:6px; }
  .tb { border-radius:14px; border:1px solid var(--line); background:var(--card); font-size:15px; touch-action:none; }
  .tb.sm { height:34px; } .tb.big { flex:1; font-size:28px; }
  .tb:active { background:#ffd47944; border-color:var(--accent); }
  #hint { font-size:12px; color:var(--muted); text-align:center; }
  .touch #hint { display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <a class="ib" href="./" title="게임 목록">🎮</a>
    <b>🧱 테트리스</b><span class="sp"></span>
    <button class="ib" id="bSnd" title="소리">🔊</button>
    <button class="ib" id="bPause" title="일시정지">⏸</button>
  </div>
  <div id="stage">
    <div id="opps"></div>
    <div id="wrap"><canvas id="cv"></canvas><div id="ov"></div></div>
  </div>
  <div id="touch">
    <div id="stick"><span class="ar l">◀</span><span class="ar r">▶</span><span class="ar d">▼</span><div id="knob"></div></div>
    <div id="btns">
      <button class="tb sm" data-p="hold">보관</button>
      <div class="pair"><button class="tb big" data-p="cw">⟳</button><button class="tb big" data-p="drop">⤓</button></div>
    </div>
  </div>
  <div id="hint">← → 이동 · ↓ 빨리 · ↑/X 회전 · Z 반대 회전 · Space 바로 내리기 · C 보관 · P 일시정지</div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const COLS = 10, ROWS = 22, HID = 2, VIS = 20, CELL = 30, H = 620, BX = 16, BY = 10;
let W = 470, SX = 330;   // 그림 전체 너비와 오른쪽 열 위치 (폰 세로 화면은 오른쪽 열을 좁게 해서 판을 크게)
const COARSE = matchMedia("(pointer:coarse)").matches;
const DAS = COARSE ? .17 : .15, ARR = COARSE ? .055 : .04, LOCK = .5, MAX_RESET = 15, CLEAR_T = .28;
// 대전 규칙 — 테트리스 99 방식 (https://www.harddrop.com/wiki/Tetris_99, https://tetris.wiki/Combo)
const LV_TIMES = [0, 10, 30, 50, 70, 90, 110, 130, 150, 170, 190];     // 이 시간(초)이 지나면 다음 속도 단계
const LV_FRAMES = [60, 50, 40, 30, 20, 10, 8, 6, 4, 2, 1];             // 단계별로 한 칸 내려오는 데 걸리는 프레임 수 (60프레임 = 1초)
const COMBO_ATK = [0, 1, 1, 2, 2, 3, 3, 4, 4, 4, 5, 5, 5];             // 콤보 n번째에 더해지는 공격 줄 (13 이상은 5)
const GARB_DELAY = 2.5, GARB_MAX = 12, PC_ATK = 4;                     // 받은 줄이 올라오기까지 2.5초 · 대기 최대 12줄 · 퍼펙트 클리어 +4
const EMO = ["🐱", "🐻", "🐰", "🐧"], NAME = ["냥이", "곰돌", "토순", "펭귄"], TINT = ["#5ec2ff", "#ff6b81", "#7be495", "#ffd479"];
const KEY = "tetris-v1";
let cfg = { best:0, bestLines:0, sound:true, lvl:1 };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch {} };

// ---------------------------------------------------------------- 블록 정의
const DEF = { I:["....", "XXXX", "....", "...."], O:["XX", "XX"], T:[".X.", "XXX", "..."], S:[".XX", "XX.", "..."], Z:["XX.", ".XX", "..."], J:["X..", "XXX", "..."], L:["..X", "XXX", "..."] };
const COLOR = { I:"#4dd0e1", O:"#ffd54f", T:"#b266e0", S:"#66d17a", Z:"#ef5350", J:"#5c7cfa", L:"#ffa23e", G:"#6b7090" };
const ORDER = "IOTSZJL";
const rotM = m => m.map((_, r) => m.map((_, c) => m[m.length - 1 - c][r]));
const SHAPE = {};
for (const t of ORDER) {
  let m = DEF[t].map(r => [...r].map(ch => ch === "X" ? 1 : 0)); SHAPE[t] = [];
  for (let k = 0; k < 4; k++) { const cells = []; m.forEach((row, r) => row.forEach((v, c) => { if (v) cells.push([c, r]); })); SHAPE[t].push(cells); m = rotM(m); }
}
// SRS 벽 차기 (y는 위쪽이 +)
const KJ = { "01":[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]], "10":[[0,0],[1,0],[1,-1],[0,2],[1,2]], "12":[[0,0],[1,0],[1,-1],[0,2],[1,2]], "21":[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
             "23":[[0,0],[1,0],[1,1],[0,-2],[1,-2]], "32":[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]], "30":[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]], "03":[[0,0],[1,0],[1,1],[0,-2],[1,-2]] };
const KI = { "01":[[0,0],[-2,0],[1,0],[-2,-1],[1,2]], "10":[[0,0],[2,0],[-1,0],[2,1],[-1,-2]], "12":[[0,0],[-1,0],[2,0],[-1,2],[2,-1]], "21":[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
             "23":[[0,0],[2,0],[-1,0],[2,1],[-1,-2]], "32":[[0,0],[-2,0],[1,0],[-2,-1],[1,2]], "30":[[0,0],[1,0],[-2,0],[1,-2],[-2,1]], "03":[[0,0],[-1,0],[2,0],[-1,2],[2,-1]] };

const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };

// ---------------------------------------------------------------- 소리
let ac = null;
function tone(f, d = .08, type = "square", v = .05, slide = 0, delay = 0) {
  if (!cfg.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume();
    const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d + .02);
  } catch {}
}
const SFX = {
  move: () => tone(330, .025, "square", .012), rot: () => tone(520, .04, "square", .03), lock: () => tone(150, .07, "triangle", .09),
  drop: () => tone(220, .12, "triangle", .12, -150), hold: () => tone(420, .08, "sine", .07, 200),
  clear: n => { for (let i = 0; i <= n; i++) tone(523 * Math.pow(1.2, i), .12, "square", .05, 0, i * .06); },
  big: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .16, "triangle", .08, 0, i * .07)),
  level: () => { tone(660, .1, "square", .05); tone(880, .14, "square", .05, 0, .09); }, warn: () => tone(180, .18, "sawtooth", .06, -60),
  garb: () => tone(110, .16, "sawtooth", .09, -50), tick: () => tone(700, .08, "sine", .08), go: () => tone(1050, .22, "sine", .09),
  over: () => [440, 392, 330, 262].forEach((f, i) => tone(f, .2, "triangle", .08, 0, i * .14)),
};

// ---------------------------------------------------------------- 게임 상태 (내 판)
let mode = "solo", state = "idle";           // state: idle count play clearing paused dead won
let board, cur, hold, canHold, score, lines, combo, b2b, rnd = Math.random, queue = [];
let gAcc, lockT, lockResets, lowestY, lastRot, lastKick, clearRows = [], clearT = 0, cd = 0, lastCd = 0;
let held = { left:false, right:false, down:false }, hdir = 0, dasT = 0, arrT = 0;
let popups = [], shake = 0, pending = [], atkSent = 0, playT = 0, lvShown = 1, snapT = 0, lastSnapKey = "", myRank = 0;

const level = () => mode === "vs" ? LV_TIMES.filter(t => playT >= t).length : cfg.lvl + Math.floor(lines / 10);
const normalInterval = () => mode === "vs" ? LV_FRAMES[level() - 1] / 60 : Math.max(.004, Math.pow(Math.max(.1, .8 - (level() - 1) * .007), level() - 1));
const lvProgress = () => { const i = level() - 1; return i >= LV_TIMES.length - 1 ? 1 : (playT - LV_TIMES[i]) / (LV_TIMES[i + 1] - LV_TIMES[i]); };
let target = null;   // 내가 직접 고른 공격 대상 (없으면 무작위)
const pendingTotal = () => pending.reduce((a, p) => a + p.n, 0);
const emptyBoard = () => Array.from({ length:ROWS }, () => Array(COLS).fill(0));
const clearHeld = () => { held.left = held.right = held.down = false; hdir = 0; dasT = arrT = 0; document.querySelectorAll(".tb.dn").forEach(b => b.classList.remove("dn")); };

function refill() { while (queue.length < 8) { const b = [...ORDER]; for (let i = 6; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } queue.push(...b); } }
const takeNext = () => { refill(); return queue.shift(); };

function fits(t, rot, x, y) {
  for (const [c, r] of SHAPE[t][rot]) { const bx = x + c, by = y + r; if (bx < 0 || bx >= COLS || by < 0 || by >= ROWS || board[by][bx]) return false; }
  return true;
}
const grounded = () => !fits(cur.t, cur.rot, cur.x, cur.y + 1);
function ghostY() { let y = cur.y; while (fits(cur.t, cur.rot, cur.x, y + 1)) y++; return y; }
const pop = (a, b = "", col = "#ffd479") => { popups.push({ t:0, a, b, col }); if (popups.length > 4) popups.shift(); };

function newGame(o = {}) {
  mode = o.vs ? "vs" : "solo"; document.body.classList.toggle("vs", mode === "vs");
  board = emptyBoard(); rnd = o.seed != null ? rng(o.seed) : Math.random; queue = [];
  hold = null; canHold = true; score = 0; lines = 0; combo = -1; b2b = false; pending = []; atkSent = 0; playT = 0; myRank = 0; target = null;
  popups = []; shake = 0; gAcc = 0; clearHeld(); lastSnapKey = ""; snapT = 0; cur = null; clearRows = [];
  lvShown = level(); refill();
  $("bPause").textContent = mode === "vs" ? "🚪" : "⏸";
  layout(); showOv(null);
  if (mode === "vs") { state = "count"; cd = 3; lastCd = 0; } else { state = "play"; spawnNext(); }
}

function spawn(t) {
  cur = { t, rot:0, x:t === "O" ? 4 : 3, y:0 }; lockT = 0; lockResets = 0; lastRot = false; lastKick = 0; gAcc = 0;
  if (!fits(t, 0, cur.x, cur.y)) { die(); return false; }
  if (fits(t, 0, cur.x, 1)) cur.y = 1;
  lowestY = cur.y; return true;
}
const spawnNext = () => spawn(takeNext());

function tryMove(dx) {
  if (!fits(cur.t, cur.rot, cur.x + dx, cur.y)) return false;
  cur.x += dx; lastRot = false; if (grounded() && lockResets < MAX_RESET) { lockT = 0; lockResets++; } SFX.move(); return true;
}
function rotate(dir) {
  if (cur.t === "O") return false;
  const from = cur.rot, to = (from + dir + 4) % 4, tbl = (cur.t === "I" ? KI : KJ)[from + "" + to];
  for (let i = 0; i < tbl.length; i++) {
    const nx = cur.x + tbl[i][0], ny = cur.y - tbl[i][1];
    if (fits(cur.t, to, nx, ny)) {
      cur.x = nx; cur.y = ny; cur.rot = to; lastRot = true; lastKick = i;
      if (grounded() && lockResets < MAX_RESET) { lockT = 0; lockResets++; }
      if (cur.y > lowestY) { lowestY = cur.y; lockResets = 0; }
      SFX.rot(); return true;
    }
  }
  return false;
}
function hardDrop() {
  let n = 0; while (fits(cur.t, cur.rot, cur.x, cur.y + 1)) { cur.y++; n++; }
  if (n) lastRot = false; score += 2 * n; shake = Math.max(shake, .3); SFX.drop(); lockPiece();
}
function doHold() {
  if (!canHold || state !== "play") return;
  const t = cur.t; canHold = false; SFX.hold();
  if (hold === null) { hold = t; spawnNext(); } else { const h = hold; hold = t; spawn(h); }
}

const corner = (x, y) => x < 0 || x >= COLS || y >= ROWS || (y >= 0 && !!board[y][x]);
function lockPiece() {
  let spin = 0;
  if (cur.t === "T" && lastRot) {
    const k = [[0,0],[2,0],[0,2],[2,2]].map(([a, b]) => corner(cur.x + a, cur.y + b));
    if (k.filter(Boolean).length >= 3) { const front = [[0,1],[1,3],[2,3],[0,2]][cur.rot]; spin = front.every(i => k[i]) || lastKick === 4 ? 2 : 1; }
  }
  const cells = SHAPE[cur.t][cur.rot].map(([c, r]) => [cur.x + c, cur.y + r]);
  for (const [x, y] of cells) board[y][x] = cur.t;
  const lockOut = cells.every(([, y]) => y < HID);
  const full = []; board.forEach((row, r) => { if (row.every(Boolean)) full.push(r); });
  SFX.lock(); cur = null;
  if (lockOut) { die(); return; }
  award(full.length, spin, full);
  if (full.length) { state = "clearing"; clearRows = full; clearT = 0; }
  else afterLock();
}
function afterLock() {
  canHold = true;
  if (pending.length) {   // 받은 지 2.5초가 지난 줄만, 먼저 받은 순서대로 올라온다
    let rows = 0, topOut = false;
    while (pending.length && pending[0].age >= GARB_DELAY) { const p = pending.shift(); topOut = addGarbage(p.n, p.hole) || topOut; rows += p.n; }
    if (rows) { shake = .7; SFX.garb(); pop("쓰레기 줄 +" + rows, "", "#ff8a80"); }
    if (topOut) { die(); return; }
  }
  spawnNext();
}
function addGarbage(k, hole) {
  let over = false; for (let r = 0; r < k; r++) if (board[r].some(Boolean)) over = true;
  board.splice(0, k);
  for (let i = 0; i < k; i++) { const row = Array(COLS).fill("G"); row[hole] = 0; board.push(row); }
  return over;
}
function finishClear() {
  board = board.filter((_, r) => !clearRows.includes(r)); while (board.length < ROWS) board.unshift(Array(COLS).fill(0));
  clearRows = []; state = "play"; canHold = true; spawnNext();
}

// ---------------------------------------------------------------- 점수 · 공격
function award(n, spin, full) {
  const lv = level();
  let base = spin === 2 ? [400, 800, 1200, 1600][n] : spin === 1 ? [100, 200, 400][Math.min(n, 2)] : [0, 100, 300, 500, 800][n];
  let pts = base * lv, atk = 0;
  const name = [spin ? (spin === 2 ? "T-스핀" : "미니 T-스핀") : "", ["", "싱글", "더블", "트리플", "테트리스"][n]].filter(Boolean).join(" ");
  if (n > 0) {
    atk = spin === 2 ? [0, 2, 4, 6][n] : spin === 1 ? [0, 0, 1][Math.min(n, 2)] : [0, 0, 1, 2, 4][n];

  const open = n => {
    const code = genCode(), peer = new Peer("ptet-" + code);
    peer.on("open", () => { net.peer = peer; net.host = true; net.code = code; net.slot = 0; net.members = [0]; net.phase = "lobby"; showOv("lobby"); });
    peer.on("connection", hostAccept);
    peer.on("error", e => {
      if (e.type === "unavailable-id" && n < 5) { peer.destroy(); open(n + 1); }
      else if (!net.host) { netClose(); showOv("online", { err:"방을 만들지 못했어요 (" + e.type + ")" }); }
    });
  };
  open(0);
}
function hostAccept(c) {
  const go = () => {
    const deny = why => { try { c.send({ t:"deny", why }); } catch {} setTimeout(() => { try { c.close(); } catch {} }, 400); };
    if (net.phase !== "lobby") return deny("이미 게임이 진행 중이에요.");
    const slot = [1, 2, 3].find(s => !net.conns[s]);
    if (slot == null) return deny("방이 가득 찼어요 (최대 4명).");
    net.conns[slot] = c; net.members = [0, ...Object.keys(net.conns).map(Number)].sort();
    c.on("data", m => hostMsg(slot, m));
    c.on("close", () => { if (net.conns[slot] === c) guestGone(slot); });
    broadcastLobby();
  };
  if (c.open) go(); else c.on("open", go);
}
function broadcastLobby() {
  for (const s in net.conns) { try { net.conns[s].send({ t:"lobby", you:+s, members:net.members }); } catch {} }
  if (net.phase === "lobby") showOv("lobby");
}
function guestGone(slot) {
  delete net.conns[slot]; net.members = net.members.filter(s => s !== slot);
  if (net.phase === "lobby") broadcastLobby(); else if (net.phase === "playing") hostMarkDead(slot);
}
async function netJoin(code) {
  code = (code || "").toUpperCase().trim();
  if (code.length !== 4) return showOv("online", { err:"방 코드는 4글자예요." });
  showOv("joining", { text:`방 ${code}에 연결하는 중…` });
  try { await loadPeer(); } catch { return showOv("online", { err:"인터넷에 연결할 수 없어요." }); }
  netClose();
  const peer = new Peer(); net.peer = peer;
  const fail = m => { clearTimeout(to); netClose(); showOv("online", { err:m }); };
  const to = setTimeout(() => fail("연결 시간이 초과됐어요. 코드와 인터넷을 확인해 주세요."), 12000);
  peer.on("open", () => {
    const c = peer.connect("ptet-" + code, { reliable:true }); net.hostConn = c; net.code = code;
    c.on("open", () => { clearTimeout(to); });
    c.on("data", guestMsg);
    c.on("close", () => { if (c === net.hostConn) toMenu("방장과 연결이 끊겼어요."); });
    c.on("error", () => fail("연결에 실패했어요."));
  });
  peer.on("error", e => { if (net.peer === peer && !net.hostConn?.open) fail(e.type === "peer-unavailable" ? "그 코드의 방이 없어요." : "연결 오류 (" + e.type + ")"); });
}
function guestMsg(m) {
  switch (m.t) {
    case "deny": { const w = m.why; toMenu(w); break; }
    case "lobby": net.slot = m.you; net.members = m.members; net.phase = "lobby"; if (mode === "vs") { mode = "solo"; state = "idle"; document.body.classList.remove("vs"); clearOpps(); layout(); } showOv("lobby"); break;
    case "start": startVs(m.seed, m.members); break;
    case "s": net.snaps[m.p] = m; break;
    case "atk": receiveAttack(m.n, m.hole, m.from); break;
    case "dead": net.alive[m.p] = false; break;
    case "over": showResults(m); break;
  }
}
function hostMsg(slot, m) {
  switch (m.t) {
    case "s": m.p = slot; net.snaps[slot] = m; relay(m, slot); break;
    case "atk": routeAttack(slot, m.n, m.hole, m.to); break;
    case "dead": hostMarkDead(slot); break;
  }
}
function hostStart() {
  if (!net.host || net.members.length < 2) return;
  const seed = Math.floor(Math.random() * 2 ** 31); net.phase = "playing";
  relay({ t:"start", seed, members:net.members }, -1); startVs(seed, net.members);
}
function startVs(seed, members) {
  net.members = members.slice(); net.phase = "playing"; net.snaps = {}; net.order = []; net.alive = {}; members.forEach(s => net.alive[s] = true);
  const opps = $("opps"); clearOpps();
  for (const s of members) if (s !== net.slot) {
    opps.insertAdjacentHTML("beforeend", `<div class="opp" id="o${s}"><div class="on"><span>${EMO[s]}</span><span>${NAME[s]}</span><i id="og${s}"></i></div><canvas class="mc" width="120" height="240"></canvas></div>`);
    oppCv[s] = $("o" + s).querySelector("canvas");
  }
  newGame({ vs:true, seed });
}
// 공격은 상대 한 명에게만 간다: 직접 고른 사람이 살아 있으면 그 사람, 아니면 살아 있는 상대 중 무작위 (테트리스 99의 기본 방식)
function pickTarget() {
  const c = net.members.filter(s => s !== net.slot && net.alive[s]); if (!c.length) return -1;
  return target != null && c.includes(target) ? target : c[Math.floor(Math.random() * c.length)];
}
function sendAttack(n) {
  const to = pickTarget(); if (to < 0) return;
  const hole = Math.floor(Math.random() * COLS);
  pop("⚔ " + EMO[to] + " +" + n, "", "#ffb86b");
  if (net.host) routeAttack(net.slot, n, hole, to); else sendHost({ t:"atk", n, hole, to });
}
function routeAttack(from, n, hole, to) {
  if (to === from || !net.alive[to]) return;
  if (to === net.slot) receiveAttack(n, hole, from); else { try { net.conns[to].send({ t:"atk", n, hole, from }); } catch {} }
}
function receiveAttack(n, hole, from) {
  if (mode !== "vs" || state === "dead" || state === "won") return;
  const k = Math.min(n, GARB_MAX - pendingTotal()); if (k <= 0) return;   // 대기 줄은 최대 12, 넘치는 건 사라진다
  pending.push({ n:k, hole, age:0 }); SFX.warn(); pop("⚠ " + EMO[from] + " +" + k + "줄", "", "#ff8a80");
}
function setTarget(s) { target = target === s ? null : s; }
function hostMarkDead(slot) {
  if (!net.alive[slot]) return; net.alive[slot] = false; net.order.push(slot);
  relay({ t:"dead", p:slot }, -1);
  if (net.members.filter(s => net.alive[s]).length <= 1) setTimeout(endMatch, 400);
}
function endMatch() {
  if (net.phase !== "playing") return; net.phase = "ended";
  const rank = [...net.members.filter(s => net.alive[s]), ...net.order.slice().reverse()], st = {};
  for (const s of rank) { const sn = net.snaps[s] || {}; st[s] = [sn.l || 0, sn.a || 0]; }
  const m = { t:"over", rank, st }; relay(m, -1); showResults(m);
}
function showResults(m) {
  net.phase = "ended"; clearHeld();
  if (m.rank[0] === net.slot) state = "won"; else if (state !== "dead") { state = "dead"; myRank = m.rank.indexOf(net.slot) + 1; }
  setTimeout(() => { if (net.phase === "ended") showOv("results", m); }, 700);
}
function sendSnap(force) {
  if (!board) return;
  const b = board.slice(HID).map(r => r.map(v => v || ".").join("")).join("");
  const c = state === "play" && cur ? [cur.t, cur.rot, cur.x, cur.y] : 0;
  const m = { t:"s", b, c, g:pendingTotal(), l:lines, a:atkSent }, key = b + JSON.stringify(c) + m.g + m.l + m.a;
  if (!force && key === lastSnapKey) return; lastSnapKey = key; net.snaps[net.slot] = { ...m, p:net.slot };
  if (net.host) relay({ ...m, p:0 }, -1); else sendHost(m);
}
function netTick(dt) { if (mode !== "vs") return; snapT += dt; if (snapT >= .1) { snapT = 0; sendSnap(); } }
addEventListener("beforeunload", netClose);

// ---------------------------------------------------------------- 메뉴 화면
const ov = $("ov");
const KEYHELP = COARSE ? "왼쪽 조이스틱에 손가락을 대고 좌우로 밀면 이동, 아래로 밀면 빨리 내려요<br>⟳ 회전 · ⤓ 바로 내리기 · 보관" : "← → 이동 · ↓ 빨리 내리기 · ↑/X 회전 · Z 반대 회전<br>Space 바로 내리기 · C 보관 · P 일시정지";
function showOv(name, a = {}) {
  if (!name) { ov.classList.remove("on"); ov.innerHTML = ""; return; }
  ov.innerHTML = SCREENS[name](a); ov.classList.add("on");
  const i = ov.querySelector("input"); if (i && !COARSE) i.focus();
}
const SCREENS = {
  menu: a => `<div class="panel"><h1>🧱 테트리스</h1><div class="sub">줄을 채워 지우세요</div>
    ${a.err ? `<div class="err">${a.err}</div>` : ""}
    <button class="btn main big" data-a="solo">🎯 혼자 하기</button>
    <div class="row">시작 레벨 <button class="btn" data-a="lv-">−</button><b>${cfg.lvl}</b><button class="btn" data-a="lv+">＋</button></div>
    <button class="btn big" data-a="online">👥 온라인 대결 (2~4명)</button>
    <div class="box">${KEYHELP}</div>
    <div class="note">${cfg.best ? `최고 점수 ${cfg.best.toLocaleString()} · 최다 ${cfg.bestLines}줄` : "첫 기록에 도전해 보세요"}</div></div>`,
  online: a => `<div class="panel"><h2>👥 온라인 대결</h2><div class="sub">방 코드를 주고받으면 친구 최대 4명이 함께 겨뤄요</div>
    ${a.err ? `<div class="err">${a.err}</div>` : ""}
    <button class="btn main big" data-a="host">🏠 방 만들기</button>
    <div class="row"><input class="code-in" id="codeIn" maxlength="4" placeholder="방 코드" autocomplete="off"><button class="btn" data-a="join">참가하기</button></div>
    <div class="box"><b>대결 규칙</b> (테트리스 99 방식)<br>· 더블 이상·T-스핀·콤보로 줄을 지우면 상대 <b>한 명</b>에게 쓰레기 줄을 보내요. 기본은 무작위, 상대 판을 누르면 그 사람만 노려요<br>· 받은 줄은 2.5초 뒤 올라오고(노랑→빨강), 그 전에 내가 줄을 지우면 막을 수 있어요<br>· 시간이 지날수록 블록이 빨라져요 (3분 10초에 최고 속도)<br>· 마지막까지 살아남으면 우승!</div>
    <button class="btn" data-a="menu">← 뒤로</button></div>`,
  joining: a => `<div class="panel"><h2>${a.text}</h2></div>`,
  lobby: () => {
    const link = location.origin + location.pathname + "?room=" + net.code;
    return `<div class="panel"><div class="sub">친구에게 이 코드를 알려 주세요</div><div class="code">${net.code}</div>
    <div class="row"><button class="btn" data-a="copycode">📋 코드 복사</button><button class="btn" data-a="copylink" data-link="${link}">🔗 초대 링크 복사</button></div>
    <div class="slots">${[0, 1, 2, 3].map(s => net.members.includes(s)
      ? `<div class="slot" style="border-color:${TINT[s]}88">${EMO[s]} ${NAME[s]}<small>${s === 0 ? "👑 방장" : ""}${s === net.slot ? " · 나" : ""}</small></div>`
      : `<div class="slot off">비어 있음<small>기다리는 중…</small></div>`).join("")}</div>
    ${net.host ? `<button class="btn main big" data-a="start" ${net.members.length < 2 ? "disabled" : ""}>${net.members.length < 2 ? "한 명 더 오면 시작해요" : `▶ ${net.members.length}명으로 시작`}</button>` : `<div class="sub">방장이 시작하길 기다리는 중…</div>`}
    <button class="btn" data-a="leave">나가기</button></div>`;
  },
  pause: () => `<div class="panel"><h2>⏸ 일시정지</h2><button class="btn main big" data-a="resume">계속하기</button><button class="btn big" data-a="solo">처음부터</button><button class="btn big" data-a="menu">메뉴로</button></div>`,
  leave: () => `<div class="panel"><h2>게임에서 나갈까요?</h2><div class="sub">나가면 이번 판은 탈락 처리돼요</div><button class="btn main big" data-a="resume">계속하기</button><button class="btn big" data-a="leave">나가기</button></div>`,
  over: a => `<div class="panel"><h2>게임 오버</h2>${a.nb ? `<div class="err" style="color:var(--accent)">🏆 새 최고 기록!</div>` : ""}
    <div class="box">점수 <b>${score.toLocaleString()}</b><br>지운 줄 <b>${lines}</b> · 레벨 <b>${level()}</b><br>최고 점수 <b>${cfg.best.toLocaleString()}</b></div>
    <button class="btn main big" data-a="solo">🔁 다시 하기</button><button class="btn big" data-a="menu">메뉴로</button><a class="btn" href="./">🎮 게임 목록</a></div>`,
  results: m => `<div class="panel"><h2>${m.rank[0] === net.slot ? "🏆 우승!" : "게임 끝"}</h2>
    <div class="slots">${m.rank.map((s, i) => `<div class="rk ${s === net.slot ? "me" : ""}">${["🥇", "🥈", "🥉", "4️⃣"][i]} ${EMO[s]} ${NAME[s]}${s === net.slot ? " (나)" : ""}<small>${m.st[s][0]}줄 · 공격 ${m.st[s][1]}</small></div>`).join("")}</div>
    ${net.host ? `<button class="btn main big" data-a="tolobby">🔁 다시 하기 (대기실로)</button>` : `<div class="sub">방장이 다시 시작하길 기다리는 중…</div>`}
    <button class="btn" data-a="leave">나가기</button></div>`,
};
function ui(a, btn) {
  switch (a) {
    case "solo": if (net.host || net.hostConn) netClose(); newGame(); break;
    case "menu": toMenu(); break;
    case "resume": if (mode === "solo") { state = "play"; } showOv(null); break;
    case "lv-": cfg.lvl = Math.max(1, cfg.lvl - 1); save(); showOv("menu"); break;
    case "lv+": cfg.lvl = Math.min(15, cfg.lvl + 1); save(); showOv("menu"); break;
    case "online": showOv("online"); break;
    case "host": netHost(); break;
    case "join": netJoin($("codeIn") ? $("codeIn").value : ""); break;
    case "start": hostStart(); break;
    case "leave": toMenu(); break;
    case "tolobby": net.phase = "lobby"; mode = "solo"; state = "idle"; document.body.classList.remove("vs"); clearOpps(); layout(); broadcastLobby(); showOv("lobby"); break;
    case "copycode": copy(net.code, btn); break;
    case "copylink": copy(btn.dataset.link, btn); break;
  }
}
function copy(s, btn) {
  try { navigator.clipboard.writeText(s); } catch {}
  const t = btn.textContent; btn.textContent = "복사됨 ✓"; setTimeout(() => { btn.textContent = t; }, 1200);
}
ov.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (b) ui(b.dataset.a, b); });
$("opps").addEventListener("click", e => { const o = e.target.closest(".opp"); if (o && mode === "vs" && !o.classList.contains("dead")) setTarget(+o.id.slice(1)); });

// ---------------------------------------------------------------- 시작
let prev = performance.now();
function loop(now) { const dt = Math.min(.05, (now - prev) / 1000); prev = now; update(dt); draw(); drawOpps(); requestAnimationFrame(loop); }
syncSnd(); board = emptyBoard(); queue = []; hold = null; score = 0; lines = 0; combo = -1; refill(); layout();
const roomParam = new URLSearchParams(location.search).get("room");
if (roomParam) netJoin(roomParam); else showOv("menu");
requestAnimationFrame(loop);
</script>
